# Armed Layer-1 openers per lane (B-014). Contract: docs/CONTRACTS.md section 21.
#
# Each [[opener]] is a no-model, day-1 opener: a lane, the engine that opens the lane's first
# release, synthetic first-days fixtures (ctf.openers.fixtures) with the frozen answer key the engine
# must print on each, and neutral controls on which no key may hold. `python -m ctf arm` is the
# regression gate: it builds every fixture, runs the engine under the intake network guard with no
# token, no ledger and a fresh workdir, checks every key, and checks no key also holds on a control.
# The point is that the first release of ANY event is played armed, with no model, as Days 1-3 of
# the 2026 events were not (see docs/build-log/B-014.md).
#
# Keys: lane (the opener's unique key: the solvers/<lane>/ folder, or a name of its own when a folder
# holds several openers), category (the event.toml category this serves), engine (id;
# a cli entry, run on the fixture file), label, fixture + expect (the base case), controls (neutral
# fixtures, at least one). [[opener.case]]: fixture, expect, mode (the row mode it stands for),
# within (a timed case's window, seconds). Optional: needs_tools (beyond the manifest's own),
# needs_os_sandbox (the engine loads ctypes or starts programs: armed only under the OS sandbox),
# offline/reason (armed only against a live or fake service: reported not-run, never green).
#
# A multi-delivery Mastery case (B-042) is a saved attempt, attempt.json beside its deliveries
# (ctf.openers.set_fixtures). The gate runs the opener's engine once per set, on the set's own delivery
# as ctf.deliveries pairs them, and prefixes each set's lines `set<N>> ` with the file path replaced by
# the delivery (`delivery 2: blob.txt`). Its key therefore names the set, the delivery and the answer,
# and the lane's `*_crossed` control is the same attempt with the files of sets 1 and 2 exchanged: every
# answer still comes out there, under the wrong set. These cases carry no `within`: the window of a
# Mastery covers every set, and each set's run already has the gate's cap.
#
# Keys are anchored on the answer as the engine prints it (`<path>: <slug>   [<chain>]`), never on a
# string the engine echoes back from its input, and they carry the signal, not a default: the
# script-analysis key holds the technique and indicators because the analyzer prints its default
# scenario even on a neutral script (that is the control).

[[opener]]
lane = "warmups"
category = "Warmups"
engine = "warmups.layered_decode"
label = "Warmups layered text decoder"
fixture = "warmups_base64_slug"                       # Day-1 base: base64 blob, slug on the last line
expect = [": armed-opener-check-01   [b64]"]
controls = ["warmups_no_slug", "warmups_mastery_crossed"]

[[opener.case]]
mode = "time_trial"                                   # Day-1 Time Trial: a fresh variant in a 30 s window
fixture = "warmups_base64_variant"
expect = [": fresh-variant-check-11   [b64]"]
within = 30

[[opener.case]]
mode = "mastery"                                      # Day-1 Mastery: one numbered record `01<TAB>...`
fixture = "warmups_mastery_record"
expect = [": mastery-record-check-21   [b64]"]
within = 30

[[opener.case]]
mode = "single"                                       # Day-2: rot13 blob; the slug's digits pass through
fixture = "warmups_rot13_slug"
expect = [": half-turn-check-02   [rot13]"]

[[opener.case]]
mode = "mastery"                                      # Day-2 Mastery: records mixing base64 and rot13
fixture = "warmups_multi_record"
expect = [": multi-record-check-22   [b64 | rot13 | b64]"]
within = 30

[[opener.case]]
mode = "base"                                         # Day-3: hex blob
fixture = "warmups_hex_slug"
expect = [": hex-appeal-check-03   [hex]"]

[[opener.case]]
mode = "base"                                         # Day-3 layered: hex under base64
fixture = "warmups_layered"
expect = [": layered-wrap-check-33   [b64+hex]"]

[[opener.case]]
mode = "mastery"                                      # Day-1 Mastery: three deliveries, all blob.txt, one per set
fixture = "warmups_mastery_deliveries"
expect = ["set1> delivery 1: blob.txt: first-set-delivery-41   [b64]",
          "set2> delivery 2: blob.txt: second-set-delivery-42   [b64]",
          "set3> delivery 3: blob.txt: third-set-delivery-43   [b64]"]

[[opener.case]]
mode = "mastery"                                      # Day-4 Mastery: one bundle zip, a numbered blob per set
fixture = "warmups_mastery_bundle"
expect = ["set1> delivery 1: warmups-mastery.zip -> blob-01.txt: first-bundle-member-51   [b64]",
          "set2> delivery 1: warmups-mastery.zip -> blob-02.txt: second-bundle-member-52   [b64]"]

