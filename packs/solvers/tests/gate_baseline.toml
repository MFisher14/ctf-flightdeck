# The baseline ledger (B-153; ctf/gate/baseline.py, docs/CONTRACTS.md section 23): tests known to go red
# on the baseline tree, with the reason and the date each was entered. It never turns a red green: the
# gate splits every red into new (not listed here) and baseline (listed) reds, so a red run is
# attributable. tests/gate.toml names this file as `baseline`.
#
#   python -m ctf gate baseline check     validate; refuse an entry whose test file is gone
#   python -m ctf gate baseline add tests/test_x.py::test_y --kind flaky --reason "..."   (dated today)
#   python -m ctf gate baseline keys      the junit keys, one per line (for junit_diff --known-flaky)
#
# kind: flaky (load- or order-dependent: passes alone), env (needs something this host lacks), stale
# (an expectation the code has moved past), broken (a real defect another item owns). Remove an entry
# in the commit that fixes it. The first entries are the Phase 2-3 merge queue's known-flaky list as of
# 2026-11-12: each failed in a loaded full-suite run and passed when rerun alone.
