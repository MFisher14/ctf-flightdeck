[pytest]
# The canonical suite lives in tests/. conftest.py puts the carried engine dirs on sys.path so both
# `pytest` and `pytest tests/` resolve imports identically. Scoping collection to tests/ keeps bare
# `pytest` from recursing into legacy standalone self-test scripts under solvers/ (e.g. the carried
# script-analysis test_wavec*.py, which reference a `generic` module stripped during de-Huntressing
# and are run directly, not via pytest).
testpaths = tests
# A file that cannot be imported (most often an optional package missing from the venv) is reported as an
# error and the rest of the suite still runs; without this the bare `python -m pytest` stops after
# collection and runs nothing. Full runs: tools/suite.py (docs/BUILDING.md, "Running the full suite").
addopts = --continue-on-collection-errors
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    judge: asserts judge-acceptance replay (an accepted name answers plain); skipped unless labels.judge_ledger() is on
