# ---- B-242: one pinned image per runtime, for the runtime semantic adapters (binary.runtime_trace) --
# All share the context docker/runtime (the entry script and the self-test fixtures), so a change to
# any file there marks every one of them stale. Each base image is an exact tag AND its digest. They
# are run only by tools/sandbox.py runtime_run (no network, no host mount), which refuses an image
# whose label is not the current content hash. `smoke` re-runs the build's self-test the way
# runtime_run does: the fixture goes in as the request tar on stdin, through the entry script, under
# the exact argv _runtime_plans.build_plan gives (interpreter flags included; tests/test_runtime_images.py
# holds the two equal), and the trace must report the string the fixture builds at run time.

[[image]]
name = "runtime-wasm"
tag = "ctf-runtime-wasm:1"
dockerfile = "docker/runtime/wasm/Dockerfile"
context = "docker/runtime"
role = "optional"
py = ["wasmtime"]
smoke = [["sh", "-c", "rm -rf /tmp/req && mkdir -p /tmp/req/dep && cp /opt/selftest/selftest.wasm /tmp/req/artifact.bin && tar -C /tmp/req -cf /tmp/req.tar artifact.bin dep && /usr/local/bin/ctf-runtime-entry 35 python3 -I /opt/runner/trace_runner.py --artifact /work/artifact.bin --deps /work/dep --fuel 50000000 --seconds 30 --max-events 512 < /tmp/req.tar | grep -q ctf-selftest-ok"]]
provides = "fuel-bounded WebAssembly (wasmtime at the master's pin) for the Wasm semantic adapter"

[[image]]
name = "runtime-jvm"
tag = "ctf-runtime-jvm:25"
dockerfile = "docker/runtime/jvm/Dockerfile"
context = "docker/runtime"
role = "optional"
smoke = [["sh", "-c", "rm -rf /tmp/req && mkdir -p /tmp/req/dep && cp /opt/selftest/Selftest.class /tmp/req/artifact.bin && tar -C /tmp/req -cf /tmp/req.tar artifact.bin dep && /usr/local/bin/ctf-runtime-entry 35 java -XX:+UseSerialGC -Xmx384m -Xss2m -XX:TieredStopAtLevel=1 -XX:+PerfDisableSharedMem -Djava.awt.headless=true -cp /opt/runner TraceRunner --artifact /work/artifact.bin --deps /work/dep --fuel 0 --seconds 30 --max-events 512 < /tmp/req.tar | grep -q ctf-selftest-ok"]]
provides = "JDK 25 (class files up to version 69) for the Java class / jar semantic adapter"

