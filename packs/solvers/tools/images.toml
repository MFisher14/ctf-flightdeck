# The pinned toolchain images (B-188). One entry per image; ctf/toolchain/images.py validates the keys
# (an unknown key is an error) and lints each Dockerfile (`python -m ctf toolchain lint`).
#
#   name            unique id (lower-case)
#   tag             repo:tag, never latest
#   dockerfile      repo-relative; must sit inside context
#   context         repo-relative build folder
#   role            core (the doctor warns while it is not ok) | optional
#   platform        linux/<arch> when the image is not native (Sage is amd64 only)
#   args            build args { NAME = "value" }
#   py              requirements.in names the image installs: staged at build time with their pins
#                   (toolchain-requirements.txt) and every pin as constraints (toolchain-constraints.txt)
#   [[image.download]]  name, url (https), sha256 (64 hex; empty = unlocked: the build is refused until a
#                   human records it), arg (passed as <arg>_URL and <arg>_SHA256; the Dockerfile checks it)
#   smoke           the env-check: commands run in a fresh networkless container (`ctf toolchain smoke`)
#   versions        { tool = "version" } this image provides (`ctf toolchain versions` picks by these)
#   default_for     tools this image serves when a challenge names no version (one image per tool)
#   managed         false: another tool builds it (built_by); `ctf toolchain build` skips it
#   pinned          false: lint findings are reported, not fatal (unpinned_reason says why)
#   provides        what it is for

[[image]]
name = "toolkit"
tag = "ctf-toolkit:1"
dockerfile = "docker/toolkit/Dockerfile"
context = "docker/toolkit"
role = "core"
py = ["capstone", "lief", "pefile", "unicorn", "pyelftools", "pycryptodome", "z3-solver", "sympy", "gmpy2",
      "scapy", "pwntools"]
smoke = [["ctf-envcheck"], ["tshark", "--version"], ["perl", "-c", "/opt/john/7z2john.pl"]]
provides = "tshark, zsteg, john jumbo with a working 7z2john, 7-Zip, and the Python RE/crypto stack at the master's pins"

[[image.download]]
name = "john-jumbo"
# The jumbo-1 release tarball. If it does not build with the image's compiler, point url at a
# bleeding-jumbo commit tarball (https://github.com/openwall/john/archive/<commit>.tar.gz) instead.
url = "https://github.com/openwall/john/archive/refs/tags/1.9.0-Jumbo-1.tar.gz"
sha256 = ""            # unlocked: `curl -fsSL <url> | shasum -a 256`, then record it here (human step)
arg = "JOHN"

