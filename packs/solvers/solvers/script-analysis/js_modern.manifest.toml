# Engine manifest (docs/CONTRACTS.md section 6, B-186). Written by `python -m ctf engines generate`, then corrected
# by hand (B-247): the string values a modern JavaScript specimen computes at its top level, desugared to the ES3
# subset js_interp follows. residuals.py asks it; the CLI prints the values. Nothing is run in a script host.
id = "script_analysis.js_modern"
lane = "script-analysis"
entry = "cli:python solvers/script-analysis/js_modern.py"
capabilities = ["analysis", "cli", "legacy-output", "javascript"]
inputs = []
needs_tools = []
cost_class = "cheap"
status = "active"

[[routes]]  # B-247: a modern JavaScript specimen that computes its descriptor (arrow functions, template literals)
keywords = ["computed descriptor", "arrow function", "template literal", "node.js script"]
priority = 50
