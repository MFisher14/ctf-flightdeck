# Engine manifest (docs/CONTRACTS.md section 6, B-186). Generated by `python -m ctf engines generate`
# from the module's code, docstring and docs/toolkits page and the carried ctf/triage.py routes.
# capabilities, inputs, needs_tools and cost_class are heuristics: correct them by hand.
# Regeneration never overwrites this file.
# B-066 (by hand): the routes, the [intake] table and cost_class cheap (stdlib only, 20,000 records in 0.3 s).
id = "toolkits.cloudlogs"
lane = "toolkits"
entry = "cli:python solvers/toolkits/cloudlogs.py"
capabilities = ["analysis", "cli", "legacy-output", "documented", "gzip", "kubernetes", "oauth", "zip"]
inputs = ["csv:AuditData (Purview Unified Audit Log)", "csv:Entra portal sign-in and audit-log downloads", "json:Graph auditLogs"]
needs_tools = []
cost_class = "cheap"
status = "active"

# The head of an Entra / Purview export, quoted or not, with or without a BOM: the portal's sign-in download
# ("Date (UTC)","Request ID"), its audit-log download ("Date (UTC)","CorrelationId"), Purview's AuditData CSV
# (RecordId,CreationDate,RecordType,Operation and the classic CreationDate,UserIds,Operations,AuditData) and a
# Graph auditLogs response. A `magic:` matcher is a prefix of the file's bytes, hence one line per spelling.
[[routes]]
files = [
    'magic:"Date (UTC)","Request ID"',
    'magic:0xefbbbf2244617465202855544329222c225265717565737420494422',   # the same after a UTF-8 BOM
    'magic:Date (UTC),Request ID',
    'magic:0xefbbbf446174652028555443292c52657175657374204944',   # the same after a UTF-8 BOM
    'magic:"Date (UTC)","CorrelationId"',
    'magic:0xefbbbf2244617465202855544329222c22436f7272656c6174696f6e496422',   # the same after a UTF-8 BOM
    'magic:Date (UTC),CorrelationId',
    'magic:0xefbbbf446174652028555443292c436f7272656c6174696f6e4964',   # the same after a UTF-8 BOM
    'magic:RecordId,CreationDate,RecordType,Operation',
    'magic:0xefbbbf5265636f726449642c4372656174696f6e446174652c5265636f7264547970652c4f7065726174696f6e',   # the same after a UTF-8 BOM
    'magic:"RecordId","CreationDate","RecordType","Operation"',
    'magic:0xefbbbf225265636f72644964222c224372656174696f6e44617465222c225265636f726454797065222c224f7065726174696f6e22',   # the same after a UTF-8 BOM
    'magic:CreationDate,UserIds,Operations,AuditData',
    'magic:0xefbbbf4372656174696f6e446174652c557365724964732c4f7065726174696f6e732c417564697444617461',   # the same after a UTF-8 BOM
    'magic:"CreationDate","UserIds","Operations","AuditData"',
    'magic:0xefbbbf224372656174696f6e44617465222c2255736572496473222c224f7065726174696f6e73222c2241756469744461746122',   # the same after a UTF-8 BOM
    'magic:{"@odata.context":"https://graph.microsoft.com/v1.0/$metadata#auditLogs/',
    'magic:{"@odata.context":"https://graph.microsoft.com/beta/$metadata#auditLogs/',
]
priority = 68

[[routes]]  # the brief names the logs. " entra " is a whole word (never "reentrancy", "central")
category = ["forensics", "opsec", "misc", "osint"]
keywords = [" entra ", "purview", "unified audit", "sign-in log", "signin log", "inbox rule", "mailbox rule", "mailbox-audit", "mailbox audit", "auditdata", "azure ad"]
priority = 64

[intake]  # B-066: the per-IP pivot of every cloud export (and any access log beside them) at intake, no model
select = "files"
run = "folder"
match = [
    'magic:"Date (UTC)","Request ID"',
    'magic:0xefbbbf2244617465202855544329222c225265717565737420494422',   # the same after a UTF-8 BOM
    'magic:Date (UTC),Request ID',
    'magic:0xefbbbf446174652028555443292c52657175657374204944',   # the same after a UTF-8 BOM
    'magic:"Date (UTC)","CorrelationId"',
    'magic:0xefbbbf2244617465202855544329222c22436f7272656c6174696f6e496422',   # the same after a UTF-8 BOM
    'magic:Date (UTC),CorrelationId',
    'magic:0xefbbbf446174652028555443292c436f7272656c6174696f6e4964',   # the same after a UTF-8 BOM
    'magic:RecordId,CreationDate,RecordType,Operation',
    'magic:0xefbbbf5265636f726449642c4372656174696f6e446174652c5265636f7264547970652c4f7065726174696f6e',   # the same after a UTF-8 BOM
    'magic:"RecordId","CreationDate","RecordType","Operation"',
    'magic:0xefbbbf225265636f72644964222c224372656174696f6e44617465222c225265636f726454797065222c224f7065726174696f6e22',   # the same after a UTF-8 BOM
    'magic:CreationDate,UserIds,Operations,AuditData',
    'magic:0xefbbbf4372656174696f6e446174652c557365724964732c4f7065726174696f6e732c417564697444617461',   # the same after a UTF-8 BOM
    'magic:"CreationDate","UserIds","Operations","AuditData"',
    'magic:0xefbbbf224372656174696f6e44617465222c2255736572496473222c224f7065726174696f6e73222c2241756469744461746122',   # the same after a UTF-8 BOM
    'magic:{"@odata.context":"https://graph.microsoft.com/v1.0/$metadata#auditLogs/',
    'magic:{"@odata.context":"https://graph.microsoft.com/beta/$metadata#auditLogs/',
]
args = ["--pivot", "--brief", "{challenge}", "{folder}"]
timeout = 60
