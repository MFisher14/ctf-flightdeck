# Engine manifest (docs/CONTRACTS.md section 6, B-186). Generated by `python -m ctf engines generate`
# from the module's code, docstring and docs/toolkits page and the carried ctf/triage.py routes.
# capabilities, inputs, needs_tools and cost_class are heuristics: correct them by hand.
# Regeneration never overwrites this file.
id = "toolkits.covert_channels"
lane = "toolkits"
entry = "cli:python solvers/toolkits/covert_channels.py"
capabilities = ["executes", "cli", "legacy-output", "dns", "icmp", "pcap"]
inputs = []
needs_tools = []
cost_class = "cheap"
status = "active"

[[routes]]  # triage.py CATEGORY_ENGINES['networking'] position 4
category = ["networking"]
priority = 45

[[routes]]  # triage.py CATEGORY_ENGINES['ics'] position 5
category = ["ics"]
priority = 44

[[routes]]  # triage.py CATEGORY_ENGINES['forensics'] position 14
category = ["forensics"]
priority = 35

[[routes]]  # triage.py suggest() nudge #73
keywords = ["covert channel", "ntp refid", "refid", "dns exfil", "exfiltrat", "timing channel", "icmp tunnel"]
priority = 60

[intake]  # B-079: read every packet capture at intake; --auto reports only a DNS-dominated one (numbered QNAME streams reassembled)
select = "files"
run = "per-file"
# classic pcap (both byte orders, micro- and nanosecond), pcapng, and the two names (.cap is left
# out: firmware capsules share it); a file of either name that is not a capture fails the run, named
match = ["magic:0xd4c3b2a1", "magic:0xa1b2c3d4", "magic:0x4d3cb2a1", "magic:0xa1b23c4d", "magic:0x0a0d0d0a",
         "ext:.pcap", "ext:.pcapng"]
args = ["--auto", "{file}"]
max_files = 4
timeout = 60
