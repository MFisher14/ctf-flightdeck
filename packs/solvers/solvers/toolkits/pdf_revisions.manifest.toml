# Engine manifest (docs/CONTRACTS.md section 6, B-186). Generated by `python -m ctf engines generate`
# from the module's code, docstring and docs/toolkits page and the carried ctf/triage.py routes.
# capabilities, inputs, needs_tools and cost_class are heuristics: correct them by hand.
# Regeneration never overwrites this file.
id = "toolkits.pdf_revisions"
lane = "toolkits"
entry = "cli:python solvers/toolkits/pdf_revisions.py"
capabilities = ["analysis", "cli", "legacy-output", "documented", "osint", "pdf", "stego", "redaction", "aes"]
inputs = ["magic:%PDF-", "magic:xref"]
needs_tools = []
cost_class = "cheap"
status = "active"

[intake]  # B-002 input adapter: every PDF in the handout, at intake: its revisions, and the opener (B-073: hidden
# text, Info/XMP fields, a metadata value tried as an AES key; a flag-format match is printed and intake reads it)
# timeout is wall-clock and the budgets are CPU seconds: 4 + 3 CPU s of opener and hook in 60 s leaves room for
# a loaded machine. The revision summary and the opener's lines are flushed as printed, so a run killed at the
# timeout still hands intake what it read.
select = "files"
run = "per-file"
match = ["magic:%PDF-"]
args = ["{file}", "--open-budget", "4", "--crypto-budget", "3"]
max_files = 4
timeout = 60

[[routes]]  # inferred by `python -m ctf engines generate --file-routes` from the formats the code tests for (R-10); correct by hand
# "magic:xref" dropped by hand (R-10 round 1): the code tests lines inside a PDF; no file starts with it
files = ["magic:%PDF-"]
priority = 30

[[routes]]  # B-073: a PDF whose description says it was redacted goes to the opener first
# "blacked" (not "blacked out") so "they blacked it out" hits too
keywords = ["redact", "blacked", "black box", "black bar", "censored"]
files = ["magic:%PDF-"]
priority = 62
