# Engine manifest (docs/CONTRACTS.md section 6, B-186). Generated by `python -m ctf engines generate`
# from the module's code, docstring and docs/toolkits page and the carried ctf/triage.py routes.
# capabilities, inputs, needs_tools and cost_class are heuristics: correct them by hand.
# Regeneration never overwrites this file.
id = "toolkits.container_iac"
lane = "toolkits"
entry = "cli:python solvers/toolkits/container_iac.py"
capabilities = ["analysis", "cli", "legacy-output", "kubernetes"]
inputs = ["ext:.action", "ext:.tf", "magic:0x1f8b", "magic:0x28b52ffd", "magic:0xfd377a585a00", "magic:BZh"]
needs_tools = []
cost_class = "cheap"
status = "active"

[[routes]]  # inferred by `python -m ctf engines generate --file-routes` from the formats the code tests for (R-10); correct by hand
files = ["ext:.action", "ext:.tf"]
priority = 30

[[routes]]  # B-072: an OCI image layout in the handout (a Docker 25+ `docker save` writes one too), or a brief about one
files = ["name:oci-layout"]
priority = 62

[[routes]]  # B-072: the brief names a container image or its layers
keywords = ["oci image", "oci layout", "oci-layout", "docker image", "container image", "docker save", "image layer", "whiteout"]
priority = 55

# B-072: the layer dumper at intake. The sweep unpacks an image tar, so a layout arrives as a folder
# holding its `oci-layout` marker; the engine takes that file's folder (an image tar given whole works
# too). It writes every file version per layer, the config, the report and index.md (labels,
# annotations, history created_by and comment, whiteouts) under {out}/image-<id>/. It starts nothing
# and calls no model: deriving an answer from the history prose stays for the agent.
[intake]
select = "files"
run = "per-file"
match = ["name:oci-layout"]
args = ["image", "{file}", "--dump", "{out}"]
max_files = 2
# An image near the read caps (1 GiB in memory) is slow at this machine's load; past this the agent
# runs `python -m ctf run toolkits.container_iac image <layout> --dump <dir>` by hand.
timeout = 180
