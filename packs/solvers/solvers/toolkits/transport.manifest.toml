# Engine manifest (docs/CONTRACTS.md section 6, B-186). Generated by `python -m ctf engines generate`
# from the module's code, docstring and docs/toolkits page and the carried ctf/triage.py routes.
# capabilities, inputs, needs_tools and cost_class are heuristics: correct them by hand.
# Regeneration never overwrites this file.
id = "toolkits.transport"
lane = "toolkits"
entry = "cli:python solvers/toolkits/transport.py"
capabilities = ["executes", "cli", "legacy-output", "crc", "gps", "pcap"]
inputs = []
needs_tools = []
cost_class = "cheap"
status = "active"

[[routes]]  # triage.py CATEGORY_ENGINES['networking'] position 7
category = ["networking"]
priority = 42

[[routes]]  # triage.py CATEGORY_ENGINES['misc'] position 16
category = ["misc"]
priority = 33

# The keyword match is a lower-cased substring (router.route_matches), so a bare "ais" matched inside
# unrelated words -- "Mayonnaise", "aisle", "praise" -- and mis-routed, e.g. an OSINT onion card naming
# "Globex Artisanal Mayonnaise Co." (B-091). It is narrowed to the whole word " ais " (space-padded,
# the same whole-word form the router documents for " hci"); real AIS content is already routed by the
# dedicated toolkits.transport_ais engine ("aivdm", "aivdo", "ais payload", "ais message").
[[routes]]  # triage.py suggest() nudge #8
keywords = ["can bus", "canbus", "j1939", "obd", "ads-b", "adsb", " ais ", "nmea", "gps", "fleet", "vehicle"]
priority = 60
