# Engine manifest (docs/CONTRACTS.md section 6, B-186). Generated by `python -m ctf engines generate`
# from the module's code, docstring and docs/toolkits page and the carried ctf/triage.py routes.
# capabilities, inputs, needs_tools and cost_class are heuristics: correct them by hand.
# Regeneration never overwrites this file.
id = "toolkits.memory"
lane = "toolkits"
entry = "cli:python solvers/toolkits/memory.py"
capabilities = ["analysis", "cli", "legacy-output", "documented", "elf", "osint", "windows"]
inputs = []
needs_tools = []
# cheap: cost_class only gates intake (ctf/intake/engines.py), and what intake runs is the [intake]
# table below: `--heap-chains`, which maps the core, hashes and carves nothing else, and is bounded by
# the heap caps in memory.py (measured in docs/build-log/B-067.md). The full triage (`memory.py <file>`,
# `--vol`) is run by hand and is not what this class describes.
cost_class = "cheap"
status = "active"

[[routes]]  # triage.py CATEGORY_ENGINES['forensics'] position 2
category = ["forensics"]
priority = 47

[[routes]]  # triage.py CATEGORY_ENGINES['windows'] position 5
category = ["windows"]
priority = 44

[intake]  # B-067: run the heap-chain carver alone (--heap-chains) on every ELF core, so the record order / flag surfaces at intake
# Selected by content, never by name: the ELF header through e_type = ET_CORE (4), one entry per class
# (32/64-bit), byte order and OSABI (0 System V, 3 GNU/Linux). A core named snapshot.bin is taken, a
# script named core.js is not.
select = "files"
run = "per-file"
match = [
    "magic:0x7f454c460201010000000000000000000400",
    "magic:0x7f454c460201010300000000000000000400",
    "magic:0x7f454c460101010000000000000000000400",
    "magic:0x7f454c460101010300000000000000000400",
    "magic:0x7f454c460202010000000000000000000004",
    "magic:0x7f454c460202010300000000000000000004",
    "magic:0x7f454c460102010000000000000000000004",
    "magic:0x7f454c460102010300000000000000000004",
]
args = ["--heap-chains", "{file}"]
timeout = 60
