# Engine manifest (docs/CONTRACTS.md section 6, B-186). Generated by `python -m ctf engines generate`,
# then corrected by hand (B-245).
id = "toolkits.audio_carriers"
lane = "toolkits"
entry = "cli:python solvers/toolkits/audio_carriers.py"
capabilities = ["analysis", "cli", "audio", "wav", "lsb", "crc", "stego"]
inputs = []
needs_tools = ["py:numpy"]
cost_class = "medium"
status = "active"

# B-245: carriers read with no key: blind spread spectrum / echo sweeps, phase, parity, silence
# intervals. stegodepth_echo (60) and stegodepth_spread (62) share the echo and DSSS words but need
# the delays / the PN chips on the command line; this engine finds them, so it ranks first.
[[routes]]
keywords = ["echo hiding", "echo-hiding", "dsss", "direct-sequence", "phase coding", "phase-coded",
            "parity coding", "silence interval", "g.711", "mu-law", "a-law", "audio watermark"]
priority = 63

# "spread spectrum" alone is also an image watermark (transform_stego): only with a recording attached
[[routes]]
keywords = ["spread spectrum", "spread-spectrum"]
files = ["ext:.wav", "ext:.aif", "ext:.aiff", "ext:.aifc", "ext:.au", "ext:.snd"]
priority = 63
