# Engine manifest (docs/CONTRACTS.md section 6, B-186). Generated by `python -m ctf engines generate`
# from the module's code, docstring and docs/toolkits page and the carried ctf/triage.py routes.
# capabilities, inputs, needs_tools and cost_class are heuristics: correct them by hand.
# Regeneration never overwrites this file.
id = "mobile_android.codec_search"
lane = "mobile-android"
entry = "cli:python solvers/mobile-android/codec_search.py"
capabilities = ["analysis", "cli", "legacy-output", "apk", "base32", "base64", "dex", "xor"]
inputs = ["ext:.apk", "ext:.apks", "ext:.bin", "ext:.data", "ext:.dex", "ext:.so", "magic:0x53514c69746520666f726d6174203300", "magic:0x6465780a", "magic:0xfd377a585a00", "magic:<~", "magic:ANS-", "magic:BZh"]
needs_tools = []
cost_class = "medium"
status = "active"

[[routes]]  # inferred by `python -m ctf engines generate --file-routes` from the formats the code tests for (R-10); correct by hand
files = ["ext:.dex", "ext:.so", "magic:0x53514c69746520666f726d6174203300", "magic:0x6465780a", "magic:ANS-", "magic:QU5TL"]
priority = 25

[[routes]]  # B-229 fix round 2: the engine CLI reads a delivery (codec_search.py <apk>: solve_delivery), so a mobile
# APK routes here first; dex_chain_replay (20), the VM's trace, is listed after it as the next look.
category = ["mobile"]
files = ["ext:.apk", "ext:.apks"]
priority = 25
