# Engine manifest (docs/CONTRACTS.md section 6, B-186). Generated by `python -m ctf engines generate`
# from the module's code, docstring and docs/toolkits page and the carried ctf/triage.py routes.
# capabilities, inputs, needs_tools and cost_class are heuristics: correct them by hand.
# Regeneration never overwrites this file.
# B-229: a diagnostic over the mobile reader (python -m ctf dexvm show runs it through openers.run_engine, under the
# intake network guard), not a solver of its own: codec_search is the lane's reader for an APK, and this one's route
# ranks below it. It prints one JSON trace line per APK, not a SolverResult (legacy-output).
id = "mobile_android.dex_chain_replay"
lane = "mobile-android"
entry = "cli:python solvers/mobile-android/dex_chain_replay.py"
capabilities = ["analysis", "cli", "legacy-output", "apk", "dex"]
inputs = ["ext:.apk", "ext:.apks"]
needs_tools = []
cost_class = "medium"
status = "active"

[[routes]]  # B-229 fix round 1: the lint wants a route for every active engine. A mobile APK, ranked below
# codec_search's mobile APK route (25, added in fix round 2), the lane's reader: triage lists the trace as the next
# look, and it has no [intake] table, so intake never runs it on its own.
category = ["mobile"]
files = ["ext:.apk", "ext:.apks"]
priority = 20
