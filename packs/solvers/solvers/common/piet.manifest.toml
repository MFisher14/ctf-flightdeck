# Engine manifest (docs/CONTRACTS.md section 6, B-186). Generated by `python -m ctf engines generate`
# from the module's code, docstring and docs/toolkits page and the carried ctf/triage.py routes.
# capabilities, inputs, needs_tools and cost_class are heuristics: correct them by hand.
# Regeneration never overwrites this file.
id = "common.piet"
lane = "common"
entry = "cli:python solvers/common/piet.py"
capabilities = ["analysis", "cli", "legacy-output", "esolang", "jpeg", "png"]
inputs = ["ext:.png", "ext:.gif", "ext:.bmp"]
needs_tools = ["py:PIL"]
cost_class = "cheap"
status = "active"

[[routes]]  # B-055: a rev/misc brief that names Piet or a visual/codel program
# Integration fix (batch 39): dropped the bare generic "esolang" keyword -- it hijacked
# every esolang brief (e.g. FRACTRAN) ahead of the specific engine. Piet-specific tokens only.
keywords = ["piet", "codel", "visual program", "20 colour", "20 color"]
priority = 62

[[routes]]  # B-055: any PNG/GIF image is a candidate Piet program; the reader self-gates (off-palette -> None)
files = ["ext:.png", "ext:.gif"]
priority = 28

[intake]  # B-055: run the Piet reader on every image at intake; a non-Piet image is None, no model spawned
select = "files"
run = "per-file"
match = ["ext:.png", "ext:.gif", "ext:.bmp"]
args = ["{file}"]
max_files = 16
timeout = 30
spawns = false
