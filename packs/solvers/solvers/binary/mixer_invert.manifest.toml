# Engine manifest (docs/CONTRACTS.md section 6, B-186). Hand-written for B-024.
# capabilities, inputs, needs_tools and cost_class are heuristics: correct them by hand.
id = "binary.mixer_invert"
lane = "binary"
entry = "solvers.binary.mixer_invert:solve"
capabilities = ["analysis", "reverse", "pwn", "keygen", "mixer", "z3", "elf"]
inputs = ["magic:0x7f454c46"]
needs_tools = ["py:z3"]
cost_class = "medium"
status = "active"

[[routes]]  # reverse lane keygen/check binaries (intake adapter, just below the solver band)
category = ["reverse"]
priority = 38

[[routes]]  # pwn keygen/mixer checks
category = ["pwn"]
priority = 40

[intake]  # B-002/B-011 input adapter: invert a mixer in any ELF handout at intake
select = "files"
run = "challenge"
match = ["magic:0x7f454c46"]
timeout = 120
spawns = false
