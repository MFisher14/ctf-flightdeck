rank = 25
label = "Partitioned raw disk images (GPT and MBR)"
basis = "a raw .img stopped the Huntress Metadata lane on day 28 (disk.partition_start_lba_sequence, a GPT behind a protective MBR); disk images are a DFIR staple"
extensions = [".img", ".raw", ".dd"]
namespaces = ["disk", "gpt", "mbr"]
samples = ["disk_gpt", "disk_mbr"]
nearest = [
  { asked = "disk_image.partition_count", reader = "disk.partition_count", sample = "disk_gpt" },
  { asked = "raw_disk.partition_name_sequence", reader = "disk.partition_name_sequence", sample = "disk_gpt" },
]
gaps = [
  { asked = "disk.partition_type_name_sequence", sample = "disk_gpt", note = "no table from a type GUID or MBR code to a type name (fdisk, sgdisk and Windows name them differently)" },
  { asked = "disk.logical_partition_start_lba_sequence", sample = "disk_mbr", note = "MBR extended partitions: the EBR chain of logical partitions is not walked (a disk with one is Unknown)" },
]
