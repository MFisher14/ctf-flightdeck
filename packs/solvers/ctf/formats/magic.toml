# Local magic table (B-207). Loaded by ctf/formats/fingerprint.py; the offline known-format lookup the
# format_fingerprint step runs on a member that ctf.formats.identify could not name, BEFORE any remote
# code search.
#
# These are short, fixed byte signatures that name a format or the tool that writes it. They are NOT the
# structural detectors of catalog.toml (those parse the container); each entry here is a magic string at a
# fixed offset, the kind of token that is also safe to send verbatim to a public code search. Keep every
# signature short (a handful of bytes): the fingerprint step may send the ascii of one to GitHub, and only
# a short, non-content token may leave the host.
#
#   id     a unique slug (also printed by `ctf formats fingerprint`)
#   label  one line for people
#   tool   the tool or library that produces the format, when one is known (optional)
#   sig    the signature as hex (no spaces); 2..16 bytes
#   at     the byte offset the signature sits at (default 0)
#   ext    the names a delivery usually gives it (a hint only; never matched on alone)
#   note   why it matters / what to do next (optional)

[[magic]]
id = "sqlite3"
label = "SQLite 3 database"
tool = "sqlite3 / libsqlite3"
sig = "53514c69746520666f726d6174203300"   # "SQLite format 3\x00"
ext = [".sqlite", ".sqlite3", ".db"]
note = "open with the sqlite3 module read-only; tables/rows carry the content"

[[magic]]
id = "pcap_le"
label = "libpcap capture (little-endian, microsecond)"
tool = "tcpdump / libpcap"
sig = "d4c3b2a1"
ext = [".pcap", ".cap"]
note = "a packet capture; dissect with the pcap readers, not as a flat file"

[[magic]]
id = "pcap_be"
label = "libpcap capture (big-endian, microsecond)"
tool = "tcpdump / libpcap"
sig = "a1b2c3d4"
ext = [".pcap", ".cap"]

[[magic]]
id = "pcap_le_ns"
label = "libpcap capture (little-endian, nanosecond)"
tool = "tcpdump / libpcap"
sig = "4d3cb2a1"
ext = [".pcap"]

[[magic]]
id = "pcapng"
label = "pcapng capture"
tool = "Wireshark / dumpcap"
sig = "0a0d0d0a"
ext = [".pcapng", ".ntar"]

[[magic]]
