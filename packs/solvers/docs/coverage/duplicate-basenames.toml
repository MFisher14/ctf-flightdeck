# Engine modules that share a basename on purpose (R-10). `python -m ctf engines lint` checks each
# entry against the tree: the files that share the name, and the one a flat `import <basename>` gets
# on the engine sys.path (tools/, then web, warmups, script-analysis, mobile-android,
# metadata-forensics, binary, toolkits, common). A shared name that is not listed here is lint error
# `duplicate-basename`; an entry whose files or flat import no longer match is the same error; an
# entry for a name no longer shared is `stale-duplicate-doc`.
#
# A flat import of one of these names is unambiguous only from the folder of `flat_import`; from any
# other folder lint reports `ambiguous-import`, and the caller loads the exact file instead
# (solvers/common/_shadowed.py: common_module("name") or module_at(path, alias)).
# A new engine picks a basename no other engine uses (docs/BUILDING.md); this list is for the carried pairs.

[[duplicate]]
basename = "agent_trace"
files = ["solvers/common/agent_trace.py", "solvers/toolkits/agent_trace.py"]
flat_import = "solvers/toolkits/agent_trace.py"
reason = "common: the readers (transcripts, MCP/agent configs, RAG corpora). toolkits: the toolkit face (CLI, question side), which loads the common readers by path."

