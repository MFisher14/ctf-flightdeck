# The "ignores the hint" lexicon.
#
# Each [[technique]] is one technique a challenge description can hint at.
#   id          lower-case words joined by '-' (stable; used in configs and the judge)
#   name        for the player, e.g. "SSTV (slow-scan TV)"
#   advice      what to do instead, used in the redirect suggestion text
#   description cues: words/phrases a description uses when it points at this technique
#   actions     cues a lane's commands, tools, libraries or file names show when it follows it
#
# Cues are matched as whole words after normalisation (accents dropped, lower case, runs of
# other characters collapsed to one space). Keep description cues to plain English a setter
# would write; keep action cues to tool and library names and command words, so a lane that
# merely mentions a technique in prose does not count as doing it. Challenge text is data:
# nothing here is a payload or an instruction, only words to match.

