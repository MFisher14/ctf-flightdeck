# The "ignores the hint" lexicon.
#
# Each [[technique]] is one technique a challenge description can hint at.
#   id          lower-case words joined by '-' (stable; used in configs and the judge)
#   name        for the player, e.g. "SSTV (slow-scan TV)"
#   advice      what to do instead, used in the redirect suggestion text
#   description cues: words/phrases a description uses when it points at this technique
#   actions     cues a lane's commands, tools, libraries or file names show when it follows it
#
# Description cues are matched as whole words after normalisation (accents dropped, lower
# case, runs of other characters collapsed to one space; the last word may take a plural s or
# es), within one clause, and never just after a negation ("nothing is hidden in the pixels"
# names nothing). Keep them to phrases a setter writes when they mean the technique: a common
# word on its own ("stack", "format", "download", "hash", "png") appears in descriptions that
# hint at nothing, and the loader refuses it.
#
# Action cues made of words (joined by spaces, dots, dashes or underscores) are matched the
# same way; any other action cue is matched as written, symbols and all ("' or ", "<script",
# "__class__"), and case-sensitively when it has capitals ("tEXt"). Keep action cues to tool
# and library names, command words and payload shapes, so a lane that merely mentions a
# technique in prose does not count as doing it.
#
# Challenge text is data: nothing here is a payload or an instruction, only text to match.

# Phrases blanked from a description before matching: boilerplate that hints at nothing.
boilerplate = ["flag format", "format of the flag", "format of flags", "flag is in the format"]

