# The model catalog behind `flightdeck models` (model_catalog.py loads and checks it). It lists
# model choices for flightdeck's two model roles: lanes (the tool loop, on [api] and the
# [models] ladder) and the light role ([light]: small classification jobs). `flightdeck models`
# matches it against this machine and recommends: it never picks for the player and never
# changes a config.
#
# [[local]]: an open-weight model served on the player's machine.
#   id          what `flightdeck models ID` takes
#   name, family, parameters (as `ollama show` counts them), license
#   roles       the roles the catalog considers it for: "lanes" (needs reliable tool calls) and
#               "light". Each build serves them all but those its not_for names; `flightdeck
#               models` offers the model for a role while at least one of its builds serves it.
#   [local.ollama], [local.mlx]: the model as one runtime serves it.
#     model         the runtime's name for it: an Ollama tag; a Hugging Face repo for mlx_lm.server
#     quantization, size_bytes (its weights on disk)
#     server_args   [local.mlx] only: the arguments mlx_lm.server was run with when it was measured;
#                   `flightdeck models` prints them in the command that serves it. Thinking models
#                   need theirs: served as they come, they spend their replies thinking.
#     thinking      the [light] thinking its light results were measured with, when that is not
#                   flightdeck's default for a server on this machine (thinking off): the [light]
#                   lines `flightdeck models` prints for it set it, and eval-local's command too.
#     not_for       per role, one line: why this build should not serve that role, with what was
#                   measured. It is then listed as not for that role, with the line, and never as
#                   a fit for it.
#     measured      per role, a one-line result from docs/MODELS.md for this build as served here
#                   (with its server_args)
#     [local.<runtime>.jobs]  the light role job by job, as `flightdeck eval-local` scored each
#                   job the way a run uses it, on the cases [eval] describes: hint (right; a run
#                   uses the rules), judge and flagcheck (right in a run), and category, family and
#                   recon as { right = N, wrong = N }, the answers right and wrong where a run asks
#                   the model and has none without it (route's category where the board names none,
#                   its specialist family, recon's brief). A build with jobs has no light line of its
#                   own: model_catalog.py writes it from these (jobs_line()).
# Every quantization and size below comes from the records of the benchmark behind
# docs/MODELS.md (one machine: an Apple M4 Max with 36 GB): `ollama show` output
# (logs/ollama-show-*.txt) and the "disk" record of each runtime's measure file
# (results/<runtime>-<model>.measure.json), named beside each value; server_args and not_for
# name theirs too. The first table of the benchmark's write-up gives the same sizes, rounded,
# and the same quantizations. A value it did not record is left out: `flightdeck models` then
# says it cannot tell whether that build fits, unless Ollama on the player's machine has pulled
# it and gives its size. The five smaller models (Qwen3.5 0.8B, 2B and 4B, Gemma 4 E2B and E4B)
# and every jobs table come from a second measurement on the same machine the same day, the
# small-model one: its records are named beside each value (results/ollama-<tag>.measure.json,
# .lane.json and .eval-head.json, the last eval-local at commit 3c7a64b with thinking off).
# Ollama there was 0.34.2, running the llama.cpp (GGUF) builds these sizes are; Ollama 0.40 and
# later on Apple Silicon runs many of these models on MLX, from builds of other sizes, which
# nothing here measured.
# Every result in measured and not_for comes from the tables of that write-up: "Tool calls" (5
# tries in flightdeck's request shape), "Light role" (`flightdeck eval-local`, scored out of 44:
# 30 hint and 14 judge jobs, where the rules, flightdeck's default, score 38) and "Lane" (four
# practice challenges, Crab Walk, Half and Half, Mille Feuille and Welcome Mat, one lane at a
# time, 480 s for all four), or from the small-model measurement's records, made the same ways.
# All were measured on 2026-11-11: one machine, under load (its load average often above 100),
# one run; every number is approximate, and a lane's count in particular can differ from run to
# run.
# A build that measured badly for a role is not for it (not_for, with the numbers): for lanes, no
# usable tool call or no practice challenge solved. For the light role, a build with jobs is for
# each job it did no worse at than flightdeck's default, which needs no model and costs nothing
# (model_catalog.py offered_jobs(), whose module doc gives the rule), and for the light role when
# it is for one; a build measured only on the earlier set of 44 scored cases is not for the light
# role below the rules' 38, and is for the judge alone, the one job of a run that set measured.
# The memory a model needs is not stored here: model_catalog.py estimates it as its weights
# (size_bytes) plus an allowance for the context (CONTEXT_ALLOWANCE). An estimate, not a
# measurement.
#
# [eval]: the case set every jobs table was scored on, `flightdeck eval-local`'s bundled cases at
# 3c7a64b (hint 30, judge 14, summary 14, route 40, recon 30, flagcheck 40), and flightdeck's
# default on it: eval-local's rules column, a run with no light model (the rules for hint; the
# judge's alert as the rules raised it; route's category from the board, and the 9 cases where
# the board names none flightdeck knows, where a run asks a model; the planted-flag hold alone
# for flagcheck). tests/test_model_catalog.py checks it against the bundled cases, so a changed
# case set cannot quietly sit under results scored on this one.
#
# [[api]]: a model API. classifier = true: the provider's safety classifier can decline
# security work. The Anthropic entry's ladder and prices are the ones `flightdeck init
# --provider anthropic` writes (setup.py ANTHROPIC_LADDER and ANTHROPIC_PRICES), read from there
# and never copied here. The OpenRouter entry names no models: its list changes.

[eval]
hint = { cases = 30, default = 30 }
judge = { cases = 14, default = 8 }
category = { cases = 40, default = 30, asked = 9 }
family = { cases = 40 }
recon = { cases = 30 }
flagcheck = { cases = 40, default = 30 }

