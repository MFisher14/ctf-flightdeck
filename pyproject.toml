[project]
name = "ctf-flightdeck"
version = "0.2.0"
description = "A terminal harness for playing CTFs with AI agents, where the player runs the loop."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Maximus Fisher" }]
keywords = ["ctf", "capture-the-flag", "security", "ai-agents", "llm", "tui", "terminal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

dependencies = [
    "anthropic>=2.8.0,<3",
    "httpx>=0.28",
    "textual>=8.2.8",
    "typer>=0.29.0",
]

[project.urls]
Homepage = "https://github.com/MFisher14/ctf-flightdeck"
Documentation = "https://github.com/MFisher14/ctf-flightdeck#readme"
Issues = "https://github.com/MFisher14/ctf-flightdeck/issues"
Changelog = "https://github.com/MFisher14/ctf-flightdeck/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Cactus Needle, an optional on-device model (see src/ctf_flightdeck/needle.py). Pinned: its
# engine and weights download on first use, and flightdeck turns its telemetry off.
cactus = ["cactus-compute==4.1.0"]
# Build mode's `flightdeck build check` runs a pack's case tests with pytest.
build = ["pytest>=9.2.0"]

[project.scripts]
flightdeck = "ctf_flightdeck.cli:main"
ctfdeck = "ctf_flightdeck.cli:main"
ctf-flightdeck = "ctf_flightdeck.cli:main"  # so `uvx ctf-flightdeck` runs it with no install

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
