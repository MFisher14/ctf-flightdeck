# Tests and the secret scan on every push and pull request. No secrets are needed: the tests use
# local fakes only (a fake model server, a fake CTFd, fake agent CLIs). No test pulls or builds
# an image: a Docker test whose image is absent reports as not run. So the Linux job pulls the
# test image in a step of its own and sets FLIGHTDECK_REQUIRE_DOCKER=1, which makes a Docker
# test that cannot run fail (CONTRIBUTING.md): the job passes only when they ran. The macOS
# runner has no Docker, and there they report as not run, with the reason in pytest's summary.
# The tests run on every core of the runner (pytest -n auto, pytest-xdist: CONTRIBUTING.md);
# the release workflow runs them one after the other.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:  # run it by hand: gh workflow run tests

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: python3 -I .githooks/secret_scan.py --all
      - name: Pull the image the Docker tests use (the tests never pull)
        if: runner.os == 'Linux'
        run: docker pull debian:bookworm-slim
      - name: pytest (on Linux a Docker test that cannot run fails)
        env:
          FLIGHTDECK_REQUIRE_DOCKER: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: uv run pytest -q -n auto

  # A Python L1 engine in the image flightdeck ships, gdb and the decompiler in a lane's own
  # container of it, and a real lane behind its fenced network (it reaches its instance and not
  # a second server): the image is built here (the Debian base, its packages and radare2's two
  # release archives, a few minutes), then its tests must run (FLIGHTDECK_REQUIRE_LANE_IMAGE=1
  # fails them where the image is absent or another Dockerfile built it) and -v names them.
  lane-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --locked
      - name: Build the lane image
        run: uv run flightdeck image build
      - name: A Python L1 engine, gdb and the decompiler in the lane image, and a lane's fenced network
        env:
          FLIGHTDECK_REQUIRE_LANE_IMAGE: "1"
        run: uv run pytest -v tests/test_l1_lane_image.py tests/test_egress.py

  # The solver pack (packs/solvers) as flightdeck runs it: its setup script builds its Python
  # environment (its pinned libraries, from PyPI), then the tests that run its intake on synthetic
  # challenges must run (FLIGHTDECK_REQUIRE_PACK=1 fails them where the environment is absent).
  # On macOS, where the pack was built and its own suite runs; that suite (some 42,000 tests,
  # packs/solvers/README.md) is not run here.
  solver-pack:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --locked
      - name: Set the pack up
        run: packs/solvers/setup.sh
      - name: The pack's intake on synthetic challenges, and the pack installer
        env:
          FLIGHTDECK_REQUIRE_PACK: "1"
        run: uv run pytest -v tests/test_solver_pack.py tests/test_pack.py
