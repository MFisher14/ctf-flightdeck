# Publishing to PyPI with Trusted Publishing: no token is stored anywhere. PyPI trusts this
# workflow, in this repository, running in the named GitHub environment. Each environment
# should require the maintainer's approval, so nothing is published without a click.
#
#   Rehearse: Actions > release > Run workflow > target testpypi   (publishes to test.pypi.org)
#   Release:  push a tag vX.Y.Z matching the version in pyproject.toml  (publishes to pypi.org)
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: python3 -I .githooks/secret_scan.py --all
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv build
      - name: The tag names the version being published
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
