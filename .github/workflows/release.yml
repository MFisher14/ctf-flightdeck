# Publishing to PyPI with Trusted Publishing: no token is stored anywhere. PyPI trusts this
# workflow, in this repository, running in the named GitHub environment. Each environment
# should require the maintainer's approval, so nothing is published without a click.
#
#   Rehearse: Actions > release > Run workflow > target testpypi   (publishes to test.pypi.org)
#   Release:  push a tag vX.Y.Z matching the version in pyproject.toml  (publishes to pypi.org)
#
# Beyond PyPI (packaging/):
#   deb             every run, the rehearsal too: builds the .deb for amd64 and arm64 from the
#                   wheel the build job made, installs each in a clean debian:12 container and
#                   runs flightdeck from it. It publishes nothing.
#   github-release  a tag only, after PyPI: the GitHub release, with the .debs attached. The
#                   only job that may write to this repository.
#   homebrew-tap    a tag only, after PyPI: writes the formula to MFisher14/homebrew-tap. It
#                   needs the secret HOMEBREW_TAP_TOKEN in the environment homebrew-tap (a
#                   token that can write to the tap and to nothing else); without it the job
#                   says so and passes, and the tap is not touched.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: python3 -I .githooks/secret_scan.py --all
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv build
      - name: The tag names the version being published
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  deb:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]  # amd64 and arm64: a .deb is for the machine that built it
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Build the .deb in a debian:12 container
        run: sh packaging/deb/build-in-docker.sh dist/ctf_flightdeck-*-py3-none-any.whl debs
      - name: Install it in a clean debian:12 container and run flightdeck --version and flightdeck doctor
        # doctor must exit 1 there, failing the config and Docker alone: test-in-docker.sh says why
        run: sh packaging/deb/test-in-docker.sh debs/ctf-flightdeck_*.deb "$(uv version --short)"
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ runner.arch }}
          path: debs/*.deb
          if-no-files-found: error

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [pypi, deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to create the release and attach the packages; no other job has it
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          path: debs/
          merge-multiple: true
      - name: Create the release, or add the packages to the one that exists
        run: |
          ls -l debs/
          test "$(ls debs/*.deb | wc -l)" -eq 2
          (cd debs && sha256sum *.deb > SHA256SUMS && cat SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" debs/*.deb debs/SHA256SUMS --clobber
          else
            prerelease=""
            if ! printf '%s' "${GITHUB_REF_NAME#v}" | grep -Eq '^[0-9]+(\.[0-9]+)*$'; then prerelease="--prerelease"; fi  # v1.0rc1
            gh release create "$GITHUB_REF_NAME" debs/*.deb debs/SHA256SUMS --verify-tag --title "$GITHUB_REF_NAME" \
              --notes "What changed: https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md" $prerelease
          fi

  homebrew-tap:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, pypi]
    runs-on: ubuntu-latest
    environment: homebrew-tap
    steps:
      - name: Is there a token for the tap, and is this a final release?
        id: tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice title=Homebrew tap not updated::The secret HOMEBREW_TAP_TOKEN is not set in the environment homebrew-tap, so the formula in MFisher14/homebrew-tap was not changed. CONTRIBUTING.md (Releases) says how to set it up."
          elif ! printf '%s' "${GITHUB_REF_NAME#v}" | grep -Eq '^[0-9]+(\.[0-9]+)*$'; then
            echo "::notice title=Homebrew tap not updated::$GITHUB_REF_NAME is a pre-release, and the tap holds final releases only."
          else
            echo "bump=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.tap.outputs.bump == 'yes'
      - uses: actions/download-artifact@v4
        if: steps.tap.outputs.bump == 'yes'
        with:
          name: dist
          path: dist/
      - name: The sdist on PyPI is the one this run built
        if: steps.tap.outputs.bump == 'yes'
        id: sdist
        run: |
          file=$(ls dist/ctf_flightdeck-*.tar.gz)
          url="https://files.pythonhosted.org/packages/source/c/ctf-flightdeck/$(basename "$file")"
          sha=$(sha256sum "$file" | cut -d' ' -f1)
          # PyPI can take a moment to serve a new file
          curl --fail --silent --show-error --location --retry 10 --retry-delay 15 --retry-all-errors --output published.tar.gz "$url"
          test "$(sha256sum published.tar.gz | cut -d' ' -f1)" = "$sha"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.tap.outputs.bump == 'yes'
        with:
          repository: MFisher14/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Render the formula and push it to the tap
        if: steps.tap.outputs.bump == 'yes'
        env:
          SDIST_URL: ${{ steps.sdist.outputs.url }}
          SDIST_SHA256: ${{ steps.sdist.outputs.sha256 }}
        run: |
          python3 -I packaging/homebrew/render_formula.py --url "$SDIST_URL" --sha256 "$SDIST_SHA256" \
            --lock uv.lock --output tap/Formula/ctf-flightdeck.rb
          ruby -c tap/Formula/ctf-flightdeck.rb
          cd tap
          git add Formula/ctf-flightdeck.rb
          if git diff --cached --quiet; then
            echo "::notice title=Homebrew tap unchanged::The tap already holds this formula."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "ctf-flightdeck ${GITHUB_REF_NAME#v}"
          git push origin HEAD
